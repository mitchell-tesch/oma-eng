name: validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxml2-utils \
            shellcheck \
            libvirt-clients \
            python3

      - name: Run validate-config.sh
        run: |
          chmod +x scripts/validate-config.sh
          scripts/validate-config.sh

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Check every uv lockfile is current
        run: |
          set -e
          # Fails if a pyproject.toml changed without re-locking, or a
          # pinned package can no longer be resolved.
          git ls-files '*pyproject.toml' | while read -r p; do
            d="$(dirname "$p")"
            echo "==> $d"
            (cd "$d" && uv lock --check)
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Linux-buildable NuGet dependencies
        run: |
          # HelloSpaceGass targets net8.0 (not net8.0-windows) so it
          # restores on Linux CI. This catches NuGet drift on the
          # SpaceGassApi package without needing a Windows runner.
          # The RhinoCommon-referencing samples target net7.0-windows
          # and need a Windows runner to restore against McNeel's feed,
          # so they're deliberately excluded here.
          dotnet restore src/spacegass-api/csharp/HelloSpaceGass/HelloSpaceGass.csproj

