# /etc/sysctl.d/99-vm-hugepages.conf
#
# Reserve N x 1 GiB hugepages after boot (dynamic allocation). Prefer this
# only if you can't reserve hugepages at boot time via kernel cmdline —
# post-boot allocation can fail on a fragmented system.
#
# Must match the guest <memory> in windows-eng.xml. Keep them in sync with
# scripts/set-guest-memory rather than editing by hand:
#   16 = Rhino only (minimum)
#   24 = Rhino + Strand7 + Excel/Office
#   32 = + ETABS / heavy FEA (template default)

vm.nr_hugepages = 32

# Optional: allow qemu group to lock unlimited memory (needed with hugepages)
# Set this via /etc/security/limits.d/ if your distro doesn't already.
#
# Verify with:
#     grep Huge /proc/meminfo
