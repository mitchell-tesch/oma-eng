; ~/.config/looking-glass/client.ini
;
; Looking Glass B7 client config tuned for Hyprland on Omarchy driving a
; Windows 11 guest with an Nvidia dGPU passed through.
;
; See `looking-glass-client --help` for the full option surface.

[app]
shmFile        = /dev/shm/looking-glass
allowDMA       = yes                   ; use dmabuf when the kernel supports it
renderer       = auto                  ; auto picks EGL on Wayland

[win]
title          = Windows CAD (Rhino / Strand7)
autoResize     = no                    ; keep the window size we launched at
allowResize    = yes
size           = 2560x1440             ; EDIT: your preferred initial size
fullScreen     = no
maximize       = no
minimizeOnFocusLoss = no
showFPS        = no
alerts         = yes
quickSplash    = yes
noScreensaver  = yes                   ; block Windows blanking the LG output

[wayland]
warpSupport    = yes
fractionScale  = yes                   ; enables fractional-scale support
                                       ; (note the spelling: "fractionScale",
                                       ; not "fractionalScale" — LG option
                                       ; name in client/displayservers/Wayland/wayland.c)

[egl]
vsync          = no                    ; low-latency; CAD viewports benefit
scale          = auto
multisample    = yes

[input]
grabKeyboard        = yes
grabKeyboardOnFocus = yes
releaseKeysOnFocusLoss = yes
captureOnFocus      = yes
rawMouse            = yes              ; 1:1 mouse deltas for CAD tumble
mouseSens           = 0                ; no sensitivity adjustment
autoCapture         = no               ; explicit capture with hotkey (Scroll Lock)

[spice]
enable         = yes                   ; keeps clipboard sharing working
audio          = no                    ; use QEMU ich9 audio instead

[audio]
periodSize     = 2048

; End
