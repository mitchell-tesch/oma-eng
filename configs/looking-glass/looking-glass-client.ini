; ~/.config/looking-glass/client.ini
;
; Looking Glass B7 client config tuned for Hyprland on Omarchy driving a
; Windows 11 guest with an Nvidia dGPU passed through.
;
; See `looking-glass-client --help` for the full option surface.

[app]
; EGL is the correct choice on Wayland (Hyprland). The other valid value
; is OpenGL. Note LG's INI parser does NOT strip inline `;` comments, so
; keep comments on their own line.
;
; shmFile: default backing is ivshmem-plain (desktop dGPU) at
; /dev/shm/looking-glass. Muxless laptop dGPU: switch to /dev/kvmfr0
; after loading the kvmfr module (see doc 04 §2b).
shmFile        = /dev/shm/looking-glass
allowDMA       = yes
renderer       = EGL

[win]
title          = Windows CAD (Rhino / Strand7)
autoResize     = no
allowResize    = yes
size           = 2560x1440
fullScreen     = no
maximize       = no
minimizeOnFocusLoss = no
showFPS        = no
alerts         = yes
quickSplash    = yes
noScreensaver  = yes

[wayland]
warpSupport    = yes
; The Wayland fractional-scale option is named `fractionScale` (no 'al'),
; matching client/displayservers/Wayland/wayland.c in the LG source.
fractionScale  = yes

[egl]
vsync          = no
scale          = auto
multisample    = yes

[input]
grabKeyboard        = yes
; grabKeyboardOnFocus/captureOnFocus set to `no` so the compositor
; (Hyprland super-keybinds) still work while the LG window has focus.
; LG only grabs input after the explicit escape-key hotkey — default is
; Scroll Lock; set `escapeKey` below to remap on laptops without one.
grabKeyboardOnFocus = no
releaseKeysOnFocusLoss = yes
captureOnFocus      = no
rawMouse            = yes
mouseSens           = 0
autoCapture         = no
; escapeKey         = KEY_RIGHTALT     ; uncomment + adjust if your laptop has no Scroll Lock key

[spice]
enable         = yes
audio          = no

[audio]
periodSize     = 2048

; End
