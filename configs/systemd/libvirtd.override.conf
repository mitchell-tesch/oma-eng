# Drop this into /etc/systemd/system/libvirtd.service.d/override.conf
# with `sudo systemctl edit libvirtd`.
#
# Raises the file descriptor limit so libvirtd can happily open dozens
# of vfio + evdev + virtiofs handles for the guest, and raises the number
# of processes for iothreads.

[Service]
LimitNOFILE=131072
LimitMEMLOCK=infinity
LimitNPROC=32768
