# configs/hypr/looking-glass.conf
#
# Hyprland drop-in for the Looking Glass client window. Source this from
# your main Hyprland config with:
#
#     source = ~/.config/hypr/looking-glass.conf
#
# scripts/prepare-host.sh installs this to ~/.config/hypr/looking-glass.conf
# automatically when a Hyprland config directory exists.
#
# Goals:
#   * Full-screen the LG window without a border and without blur, so the
#     guest desktop looks pixel-native.
#   * Disable animations for it — a fade-in on a 60/120 Hz CAD viewport
#     just adds latency and flicker.
#   * Send it to a dedicated workspace so switching in/out of the guest
#     is one keybinding rather than a hunt-through-tabs.
#   * Immediate mode: LG expects direct frame delivery. Tearing is
#     acceptable inside the LG window when it means lower latency.

# --- Window rules ---------------------------------------------------------

# The LG client window class is exactly `looking-glass-client`.
windowrulev2 = workspace 9 silent, class:^(looking-glass-client)$
windowrulev2 = fullscreen, class:^(looking-glass-client)$
windowrulev2 = noborder, class:^(looking-glass-client)$
windowrulev2 = noshadow, class:^(looking-glass-client)$
windowrulev2 = noblur, class:^(looking-glass-client)$
windowrulev2 = norounding, class:^(looking-glass-client)$
windowrulev2 = noanim, class:^(looking-glass-client)$
windowrulev2 = immediate, class:^(looking-glass-client)$
windowrulev2 = idleinhibit fullscreen, class:^(looking-glass-client)$

# Keep the cursor out of Hyprland's overlays while inside the guest.
windowrulev2 = nofocus, class:^(looking-glass-client)$, floating:1

# --- Layer rules ---------------------------------------------------------
# LG can present via wp_viewporter without any layer surface, so nothing
# to blur/dim. Explicitly opt out just in case a future release changes.
layerrule = noanim, ^(looking-glass-client)$
layerrule = blur 0, ^(looking-glass-client)$

# --- Keybindings ---------------------------------------------------------
# Super+G toggles to workspace 9 where LG lives. Super+Shift+G launches
# the client (assumes ~/.config/looking-glass/client.ini is populated per
# configs/looking-glass/looking-glass-client.ini).
bind = SUPER, G, workspace, 9
bind = SUPER SHIFT, G, exec, looking-glass-client
