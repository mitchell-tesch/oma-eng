# /etc/modprobe.d/vfio.conf
#
# Bind the Nvidia dGPU to vfio-pci at load time and prevent any Nvidia or
# Nouveau driver from claiming it on the host. Edit the ids= line to the
# vendor:device pairs printed by scripts/list-pci-for-passthrough.sh.
#
# Both the VGA function (class 0300) and the Audio function (0403) must be
# listed. Some cards also expose a USB-C controller (.2) and USB device
# (.3); include those too when present.

options vfio-pci ids=10de:XXXX,10de:YYYY disable_vga=1

# Keep host drivers off the Nvidia card
blacklist nouveau
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidia_uvm

# Ensure vfio_pci loads before any GPU driver enumerator
softdep nouveau pre: vfio-pci
softdep nvidia  pre: vfio-pci
