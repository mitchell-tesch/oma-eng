# /etc/modprobe.d/vfio.conf
#
# Bind the Nvidia dGPU to vfio-pci at load time and prevent any Nvidia or
# Nouveau driver from claiming it on the host. Edit the ids= line to the
# vendor:device pairs printed by scripts/list-pci-for-passthrough.sh.
#
# Desktop cards: usually VGA (class 0300) + Audio (0403), sometimes with an
# extra USB-C controller (0c03) at function .2. List every function.
# Muxless mobile Optimus: single 3D controller (class 0302) with no audio
# and no USB function — list only that one ID and use only one <hostdev>
# in configs/libvirt/windows-eng.xml.
#
# `disable_vga=1` is a no-op on class 0302 devices — safe to leave.

# HP ZBook Firefly G11 / RTX A500 Laptop (muxless, single function).
options vfio-pci ids=10de:25bb disable_vga=1

# Keep host drivers off the Nvidia card
blacklist nouveau
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidia_uvm

# Ensure vfio_pci loads before any GPU driver enumerator
softdep nouveau pre: vfio-pci
softdep nvidia  pre: vfio-pci
