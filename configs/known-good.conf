# known-good.conf — the versions this setup was last validated against.
# Read by scripts/check-updates; bump with `scripts/check-updates --bump NAME`
# only after testing (VM boots, Looking Glass, virtiofs, one CAD app).
#
# kind:
#   pkg          repo package; compared with installed + pending (checkupdates)
#   aur          AUR package; compared with installed + AUR RPC version
#   github       guest/upstream component; latest GitHub release tag
#   github-pre   as github, but also reports pre-releases (release candidates)
#   virtio-win   virtio-win stable ISO version (fedorapeople)
#   blender-ext  extensions.blender.org extension id (linux-x64)
#
# notes may hold `skip:VERSION` to mark a release reviewed and declined.
#
# kind       name                                  known-good      notes / changelog

# Host virtualisation stack
pkg          qemu-system-x86                       11.1.2-1        https://wiki.qemu.org/ChangeLog
pkg          libvirt                               1:12.8.0-1      https://libvirt.org/news.html
pkg          edk2-ovmf                             202608-1        X-PciMmio64Mb override (doc 04 2b)
pkg          virtiofsd                             1.14.0-1        https://gitlab.com/virtio-fs/virtiofsd/-/releases
pkg          swtpm                                 0.10.2-1        https://github.com/stefanberger/swtpm/releases
pkg          linux-omarchy                         7.2.8-9         kvmfr DKMS rebuild, vfio-pci binding

# Desktop
pkg          hyprland                              0.56.2-4        Lua window rules (configs/hypr/looking-glass.lua)
pkg          omarchy                               4.0.5-1         may reset hypr / pacman.conf defaults
pkg          blender                               17:5.2.2-3      general use only; py3.14, Bonsai runs in portable blender-bim (doc 14)

# Looking Glass (client held via IgnorePkg; must match guest host-app)
aur          looking-glass                         2:B7-7.1        local build + wayland-hires-scroll.patch
aur          looking-glass-module-dkms             2:B7-7          kvmfr
github-pre   gnif/LookingGlass                     B7              B8-rc1+ = IDD driver replaces host app + VDD (migration); drop scroll patch

# Guest components (installed versions are not probed; guest may be off)
github       VirtualDrivers/Virtual-Display-Driver 25.5.2          guest installer v25.05.03; skip:25.7.23 (control app only, same 2024-12-24 driver)
github       winfsp/winfsp                         v2.1            guest 2.1.25156
virtio-win   virtio-win                            0.1.302         guest tools + drivers

# Native tooling
blender-ext  bonsai                                0.9.0           portable Blender 5.2.2 (py3.13) via blender-bim; Arch Blender is py3.14 (doc 14); skip:0.9.0-post1-py311 (Blender <5.1 backport)
