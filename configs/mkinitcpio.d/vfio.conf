# /etc/mkinitcpio.conf.d/vfio.conf
#
# Adds the vfio modules to the initramfs. mkinitcpio 39+ (current on
# Arch and Omarchy) reads /etc/mkinitcpio.conf.d/*.conf as drop-ins;
# earlier releases don't. If you're on mkinitcpio < 39, install this
# file's contents into /etc/mkinitcpio.conf's MODULES=() line by hand
# instead of dropping in.
#
# We deliberately use `MODULES+=` (append) rather than `MODULES=`
# (assign) so this cannot clobber whatever modules the main config
# already declares.
#
# There is NO HOOKS= line here on purpose. Omarchy installs typically
# include encrypt / sd-encrypt / lvm2 / plymouth / btrfs in HOOKS
# depending on install-time choices — replacing that list would break
# boot on those systems. The vfio path does not require any hook change.
#
# After installing, regenerate the initramfs:
#     sudo mkinitcpio -P

MODULES+=(vfio_pci vfio vfio_iommu_type1)
