[project]
name = "oma-native-tooling"
version = "0.1.0"
description = "Host-native structural-engineering scripts: IFC (ifcopenshell) + Jupyter/handcalcs calc notebooks. Runs on Omarchy; no VM required."
requires-python = ">=3.10"
# Everything here is portable: runs on Omarchy today, also on the guest
# if you ever need to (matches the office-integration/spacegass-api uv
# convention).
dependencies = [
    "ifcopenshell>=0.8",
    "handcalcs>=1.6",
    "forallpeople>=2.6",
    "jupyterlab>=4.2",
    "jupytext>=1.16",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "scipy>=1.11",
    "sympy>=1.12",
]

[tool.uv]
package = false
